name: Build and deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-gate-build
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-gate-build
          path: build

      - name: Cache deploy tool packages
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: ${{ runner.os }}-apt-deploy-tools-v1

      - name: Install deploy tools
        run: |
          mkdir -p ~/apt-cache/archives/partial
          sudo apt-get update
          sudo apt-get \
            -o Dir::Cache::Archives="$HOME/apt-cache/archives" \
            install -y --download-only sshpass rsync
          sudo apt-get \
            -o Dir::Cache::Archives="$HOME/apt-cache/archives" \
            install -y sshpass rsync
      - name: Deploy
        env:
          SSHPASS: ${{ secrets.SSHPASS }}
        run: bash scripts/deploy.sh
